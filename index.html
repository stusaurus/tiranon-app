<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="ぼくティラノンの投稿アイデアをかんたんに管理できるアプリ">
  <title>ぼくティラノン｜投稿管理</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="site-header">
    <div class="header-inner">
      <a class="brand" href="#" aria-label="ぼくティラノン ホーム">
        <span class="brand-mark" aria-hidden="true">🦖</span>
        <span><strong>ぼくティラノン</strong><small>POST PLANNER</small></span>
      </a>
      <div class="posted-count" aria-live="polite">
        <span class="count-icon">✓</span><span>投稿済み</span><strong id="postedCount">0</strong><span>件</span>
      </div>
    </div>
  </header>

  <main class="container">
    <section class="hero">
      <div>
        <p class="eyebrow">CONTENT IDEAS</p>
        <h1>次は、なにを投稿する？</h1>
        <p>思いついたアイデアを、忘れないうちにメモしておこう。</p>
      </div>
      <button class="primary-button" id="openFormButton" type="button"><span>＋</span> 新しいアイデア</button>
    </section>

    <section class="toolbar" aria-label="投稿の絞り込み">
      <div class="search-wrap">
        <span aria-hidden="true">⌕</span>
        <input id="searchInput" type="search" placeholder="タイトルや台本を検索..." aria-label="投稿を検索">
      </div>
      <div class="filter-tabs" id="filterTabs">
        <button class="active" data-filter="すべて" type="button">すべて <span id="allCount">0</span></button>
        <button data-filter="アイデア" type="button">アイデア</button>
        <button data-filter="作成中" type="button">作成中</button>
        <button data-filter="投稿済み" type="button">投稿済み</button>
      </div>
    </section>

    <section>
      <div class="list-heading"><h2>投稿リスト</h2><span id="resultCount">0件</span></div>
      <div id="postList" class="post-grid"></div>
      <div id="emptyState" class="empty-state" hidden>
        <div class="empty-dino">🦕</div>
        <h2 id="emptyTitle">まだアイデアがありません</h2>
        <p id="emptyText">「新しいアイデア」から、最初の投稿を登録してみよう！</p>
        <button class="secondary-button" id="emptyAddButton" type="button">＋ アイデアを追加</button>
      </div>
    </section>
  </main>

  <dialog id="postDialog" aria-labelledby="dialogTitle">
    <form id="postForm" method="dialog">
      <div class="dialog-header">
        <div><p class="eyebrow">POST DETAILS</p><h2 id="dialogTitle">新しいアイデア</h2></div>
        <button class="icon-button" id="closeDialogButton" type="button" aria-label="閉じる">×</button>
      </div>
      <input id="postId" type="hidden">
      <label class="full">タイトル <span class="required">必須</span>
        <input id="title" type="text" required maxlength="80" placeholder="例：ティラノサウルスの意外な秘密">
      </label>
      <div class="field-row">
        <label>ジャンル
          <select id="genre"><option>理科</option><option>共感/あるある</option><option>その他</option></select>
        </label>
        <label>ステータス
          <select id="status"><option>アイデア</option><option>作成中</option><option>投稿済み</option></select>
        </label>
      </div>
      <label class="full">台本<textarea id="script" rows="5" placeholder="動画の流れやセリフを自由に書こう"></textarea></label>
      <label class="full">Instagram用キャプション<textarea id="caption" rows="4" placeholder="投稿文やハッシュタグを書こう"></textarea></label>
      <label class="full date-field">投稿予定日<input id="scheduledDate" type="date"></label>
      <div class="dialog-actions">
        <button class="cancel-button" id="cancelButton" type="button">キャンセル</button>
        <button class="primary-button" type="submit">保存する</button>
      </div>
    </form>
  </dialog>

  <dialog id="deleteDialog" class="confirm-dialog" aria-labelledby="deleteTitle">
    <div class="confirm-icon">🗑️</div><h2 id="deleteTitle">この投稿を削除しますか？</h2>
    <p>削除した投稿は元に戻せません。</p>
    <div class="dialog-actions"><button id="cancelDelete" class="cancel-button">キャンセル</button><button id="confirmDelete" class="danger-button">削除する</button></div>
  </dialog>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <script src="app.js"></script>
</body>
</html>
